name: Build release binaries

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install protoc --yes --no-progress

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl.light --yes --no-progress
          $openssl = Get-ChildItem 'C:\Program Files' -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'include\openssl\opensslv.h') } |
            Select-Object -First 1
          if (-not $openssl) {
            throw 'Could not locate the OpenSSL installation'
          }
          "OPENSSL_DIR=$($openssl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $crypto = Get-ChildItem $openssl.FullName -Recurse -Filter 'libcrypto.lib' | Select-Object -First 1
          $header = Get-ChildItem $openssl.FullName -Recurse -Filter 'opensslv.h' | Select-Object -First 1
          if (-not $crypto -or -not $header) {
            throw 'Could not locate the OpenSSL libraries or headers'
          }
          "OPENSSL_LIB_DIR=$($crypto.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$($header.Directory.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release binary
        working-directory: codebase
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build Slint desktop UI
        working-directory: codebase
        run: cargo build --release --locked --target ${{ matrix.target }} -p safechat-slint-ui

      - name: Bundle Windows runtime libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE 'codebase\target\${{ matrix.target }}\release'
          $dlls = Get-ChildItem (Join-Path $env:OPENSSL_DIR 'bin') -Filter '*.dll'
          if (-not $dlls) {
            throw 'Could not find the OpenSSL runtime DLLs'
          }
          Copy-Item $dlls.FullName $release -Force

      - name: Bundle UI locale files
        shell: bash
        working-directory: codebase
        env:
          TARGET: ${{ matrix.target }}
        run: cp -R slint-ui/locales "target/${TARGET}/release/locales"

      - name: Package binary
        shell: bash
        working-directory: codebase
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist
          if [[ "$ARCHIVE" == "zip" ]]; then
            7z a "dist/safechat-${TARGET}.zip" \
              "target/${TARGET}/release/safechat.exe" \
              "target/${TARGET}/release/safechat-ui.exe" \
              "target/${TARGET}/release/safechat-slint-ui.exe" \
              "target/${TARGET}/release/locales" \
              "target/${TARGET}/release/*.dll"
          else
            tar -czf "dist/safechat-${TARGET}.tar.gz" \
              -C "target/${TARGET}/release" \
              safechat safechat-ui safechat-slint-ui locales
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safechat-${{ matrix.target }}
          path: codebase/dist/*
          if-no-files-found: error

  relay-image:
    name: Publish relay image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/safechat-relay
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and publish relay image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./codebase
          file: ./codebase/relay/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Flatpak tooling
        run: sudo apt-get update && sudo apt-get install --yes flatpak flatpak-builder

      - name: Install Freedesktop runtime and SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Build Flatpak bundle
        run: |
          mkdir -p packaging/flatpak/dist
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=packaging/flatpak/repo \
            packaging/flatpak/build \
            packaging/flatpak/io.safechat.SafeChat.yml
          flatpak build-bundle packaging/flatpak/repo \
            packaging/flatpak/dist/safechat-${GITHUB_REF_NAME}.flatpak \
            io.safechat.SafeChat stable

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safechat-flatpak
          path: packaging/flatpak/dist/*.flatpak
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, relay-image, flatpak]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: safechat-*
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes release-assets/*
