name: Build release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: safechat
            archive: tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: safechat.exe
            archive: zip
          - name: macOS x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: safechat
            archive: tar.gz

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        shell: bash
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protobuf compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler

      - name: Install protobuf compiler (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install protoc --yes --no-progress

      - name: Install protobuf compiler (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          mkdir -p dist
          if [[ "$ARCHIVE" == "zip" ]]; then
            7z a "dist/safechat-${TARGET}.zip" "target/${TARGET}/release/${BINARY}"
          else
            tar -czf "dist/safechat-${TARGET}.tar.gz" -C "target/${TARGET}/release" "$BINARY"
          fi

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: safechat-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: safechat-*
          merge-multiple: true

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
