services:
  safechat-relay:
    container_name: safechat-relay
    build:
      context: ./codebase
      dockerfile: relay/Dockerfile
    image: safechat-relay:latest
    user: ${SAFECHAT_RELAY_USER:-safechat-relay}
    environment:
      SAFECHAT_RELAY_ADMIN_TOKEN: ${SAFECHAT_RELAY_ADMIN_TOKEN:?set an admin token before starting the relay}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    command:
      - serve
      - --http
      - --bind
      - 0.0.0.0:8080
      - --database
      - /var/lib/safechat-relay/relay.db
    volumes:
      - ${SAFECHAT_RELAY_DATA_DIR:-relay-data}:/var/lib/safechat-relay
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: safechat-caddy
    restart: unless-stopped
    depends_on:
      - safechat-relay
    environment:
      SAFECHAT_RELAY_HOSTNAME: ${SAFECHAT_RELAY_HOSTNAME:?set a public relay hostname}
    ports:
      - "80:80"
      - "8443:443"
    volumes:
      - ./Caddyfile.relay:/etc/caddy/Caddyfile:ro,Z
      - caddy-data:/data
      - caddy-config:/config

volumes:
  relay-data:
  caddy-data:
  caddy-config:
