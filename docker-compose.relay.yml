services:
  safechat-relay:
    container_name: safechat-relay
    build:
      context: ./codebase
      dockerfile: relay/Dockerfile
    image: safechat-relay:latest
    user: ${SAFECHAT_RELAY_USER:-safechat-relay}
    environment:
      SAFECHAT_RELAY_ADMIN_TOKEN: ${SAFECHAT_RELAY_ADMIN_TOKEN:?set an admin token before starting the relay}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ports:
      - "8443:8443"
    volumes:
      - ${SAFECHAT_RELAY_DATA_DIR:-relay-data}:/var/lib/safechat-relay
      - ${SAFECHAT_RELAY_TLS_DIR:-./relay-tls}:/etc/safechat-relay/tls:ro,Z

volumes:
  relay-data:
