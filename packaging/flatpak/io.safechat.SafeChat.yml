app-id: io.safechat.SafeChat
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: safechat-slint-ui

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=x11
  - --device=dri

modules:
  - name: safechat
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      append-path: /usr/lib/sdk/rust-stable/bin
    build-commands:
      - cargo build --release --locked --manifest-path codebase/Cargo.toml -p safechat-slint-ui
      - install -Dm755 codebase/target/release/safechat-slint-ui /app/bin/safechat-slint-ui
      - install -Dm644 packaging/flatpak/io.safechat.SafeChat.desktop /app/share/applications/io.safechat.SafeChat.desktop
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - codebase/target
          - packaging/flatpak/build
          - packaging/flatpak/repo
          - relay-tls
