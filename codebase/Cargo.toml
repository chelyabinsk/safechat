[package]
name = "safechat"
version = "0.2.0"
edition = "2024"
default-run = "safechat"

[workspace]
members = ["application", "core", "relay", "transports"]
resolver = "2"

[dependencies]
safechat-core = { path = "core" }
safechat-application = { path = "application" }
safechat-transports = { path = "transports" }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
directories = "6.0"
libc = "0.2"
dialoguer = "0.11"
png = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

# Pinned upstream Signal protocol implementation. Keep this dependency behind
# the adapter boundary so upstream updates are reviewed in one place.
signal-protocol = { package = "libsignal-protocol", git = "https://github.com/signalapp/libsignal.git", rev = "b5121d07c72f9e631f178d907ca892587f64f9e2" }
futures-executor = "0.3"
signal-rand = { package = "rand", version = "0.9" }
