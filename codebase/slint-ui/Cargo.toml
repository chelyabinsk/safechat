[package]
name = "safechat-slint-ui"
version = "0.2.5"
edition = "2024"

[dependencies]
slint = "=1.16.0"
safechat-core = { path = "../core" }
safechat-application = { path = "../application" }
safechat-transports = { path = "../transports" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
base64 = "0.22"
futures-executor = "0.3"
copypasta = "0.10.2"

[build-dependencies]
slint-build = "=1.16.0"
